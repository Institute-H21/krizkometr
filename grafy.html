<section>
  <h2>Co překročení hranice přineslo</h2>
  <p class="sub">Překročení hranice samo o sobě mandát nepřináší. Záleží ještě na tom, kolik mandátů kandidátka získala a jestli by kandidát nebyl zvolen i bez něj.</p>
  <div class="fun" id="fun"></div>
  <div style="margin-top:14px"><div class="stack" id="stack"></div><div class="skey" id="skey"></div></div>
</section>

<section>
  <h2>Podle velikosti obce</h2>
  <p class="sub">Podíl mandátů, které přeskočení obsadilo jinak, než by je obsadilo pořadí na kandidátce. Filtr velikosti se zde neuplatní, zvýrazněné je pásmo, které máte vybrané.</p>
  <svg class="chart" id="bandChart" role="img" aria-label="Podle velikosti obce"></svg>
</section>
<p class="src"><b>Zdroj dat:</b> otevřená data ČSÚ, volby do zastupitelstev obcí <span class="roky">2006–2022</span>. Přepočet Institut H21.</p>
